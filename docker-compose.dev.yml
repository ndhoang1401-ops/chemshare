# docker-compose cho môi trường PHÁT TRIỂN — chỉ chạy PostgreSQL + Adminer
# để `npm run dev` kết nối vào. Bản docker-compose.yml đầy đủ (kèm app,
# build production) sẽ được tạo ở Giai đoạn 13.
#
# Sử dụng:
#   docker compose -f docker-compose.dev.yml up -d
#
# Adminer (giao diện quản lý DB): http://localhost:8080
#   Hệ thống: PostgreSQL | Máy chủ: db | User/Pass: chemshare/chemshare | DB: chemshare

services:
  db:
    image: postgres:16-alpine
    container_name: chemshare-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: chemshare
      POSTGRES_PASSWORD: chemshare
      POSTGRES_DB: chemshare
    ports:
      - "5432:5432"
    volumes:
      - chemshare_db_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemshare -d chemshare"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: chemshare-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  chemshare_db_dev_data:
